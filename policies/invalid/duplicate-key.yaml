schema_version: "1"
policy_id: demo-policy
version: 1
rules:
  - id: deny-delete
    effect: DENY
    agents: [demo-agent]
    tools: [record.delete]
    resources: ["table:demo-records"]
rules:
  - id: allow-public-read
    effect: ALLOW
    agents: [demo-agent]
    tools: [file.read]
    resources: ["file:public-guide"]
